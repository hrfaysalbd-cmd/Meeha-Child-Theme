// মিহা অ্যাপ (Android): the correspondent and publisher web apps, opened in
// a Trusted Web Activity — Chrome's engine, full screen, with web push
// notifications, the microphone and the camera working like in Chrome.
plugins {
    id 'com.android.application'
}

def env = { String k, String d = null -> System.getenv(k) ?: d }
def keystore = env('MEEHA_KEYSTORE')

def assetStatements = { String host ->
    '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + host + '\\"}}]'
}

def twa = { flavor, String appId, String host, String name, String launcher ->
    flavor.dimension 'app'
    flavor.applicationId appId
    flavor.resValue 'string', 'appName', name
    flavor.resValue 'string', 'launcherName', launcher
    flavor.resValue 'string', 'hostName', host
    flavor.resValue 'string', 'launchUrl', 'https://' + host + '/'
    flavor.resValue 'string', 'providerAuthority', appId + '.fileprovider'
    flavor.resValue 'string', 'assetStatements', assetStatements(host)
}

android {
    namespace 'news.meeha.twa'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(env('VERSION_CODE', '1'))
        versionName env('VERSION_NAME', '1.0.0')
    }

    flavorDimensions 'app'
    productFlavors {
        correspondent {
            twa(it, 'news.meeha.correspondent', env('CORRESPONDENT_HOST', 'correspondent.meeha.news'), 'মিহা সংবাদদাতা', 'সংবাদদাতা')
        }
        publisher {
            twa(it, 'news.meeha.publisher', env('PUBLISHER_HOST', 'publisher.meeha.news'), 'মিহা ড্যাশবোর্ড', 'মিহা ডেস্ক')
        }
    }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword env('MEEHA_KEYSTORE_PASSWORD')
                keyAlias env('MEEHA_KEY_ALIAS', 'meeha')
                keyPassword env('MEEHA_KEY_PASSWORD', env('MEEHA_KEYSTORE_PASSWORD'))
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
