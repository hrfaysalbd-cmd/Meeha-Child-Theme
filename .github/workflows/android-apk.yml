# মিহা অ্যাপ (Android APK): builds the correspondent and publisher apps
# (Trusted Web Activity around correspondent.meeha.news / publisher.meeha.news).
#
# Signing: put a keystore in the repository secrets to sign with the same key
# every time (needed so a new APK installs over the old one):
#   MEEHA_KEYSTORE_B64        base64 of the .jks file
#   MEEHA_KEYSTORE_PASSWORD   its password
#   MEEHA_KEY_ALIAS           key alias (default: meeha)
# Without them a throw-away key is made for this run only (test installs).
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        env:
          KS_B64: ${{ secrets.MEEHA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MEEHA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MEEHA_KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/sign"
          KS="$RUNNER_TEMP/sign/meeha.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KIND=permanent" >> "$GITHUB_ENV"
            ALIAS="${KS_ALIAS:-meeha}"
            PASS="$KS_PASS"
          else
            PASS="$(openssl rand -hex 16)"
            ALIAS=meeha
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Meeha News, O=Meeha News, C=BD"
            echo "KIND=temporary" >> "$GITHUB_ENV"
            echo "::warning::No MEEHA_KEYSTORE_B64 secret: signed with a throw-away key (test only; a later APK will not install over this one)."
          fi
          echo "::add-mask::$PASS"
          echo "MEEHA_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "MEEHA_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "MEEHA_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "MEEHA_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          SHA=$(keytool -list -v -keystore "$KS" -alias "$ALIAS" -storepass "$PASS" | sed -n 's/.*SHA256: *//p' | head -1)
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          echo "Signing SHA-256: $SHA"

      - name: Build APKs
        working-directory: android-app
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleCorrespondentRelease assemblePublisherRelease

      - name: Collect
        run: |
          mkdir -p out/.well-known-correspondent out/.well-known-publisher
          cp android-app/app/build/outputs/apk/correspondent/release/*.apk "out/meeha-correspondent-1.0.${{ github.run_number }}-${KIND}.apk"
          cp android-app/app/build/outputs/apk/publisher/release/*.apk "out/meeha-publisher-1.0.${{ github.run_number }}-${KIND}.apk"
          for app in correspondent publisher; do
            cat > "out/.well-known-$app/assetlinks.json" <<JSON
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"news.meeha.$app","sha256_cert_fingerprints":["$SHA256"]}}]
          JSON
          done
          cat > out/README.txt <<TXT
          meeha-correspondent-*.apk -> সংবাদদাতা অ্যাপ (correspondent.meeha.news)
          meeha-publisher-*.apk     -> ডেস্ক/পাবলিশার অ্যাপ (publisher.meeha.news)
          Signing key: $KIND   SHA-256: $SHA256
          .well-known-correspondent/assetlinks.json -> https://correspondent.meeha.news/.well-known/assetlinks.json
          .well-known-publisher/assetlinks.json     -> https://publisher.meeha.news/.well-known/assetlinks.json
          (Without these files the app still works, but shows a thin address bar on top.)
          TXT
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: meeha-android-${{ github.run_number }}-${{ env.KIND }}
          path: out/
          include-hidden-files: true
          retention-days: 30
